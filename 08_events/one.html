<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html events</title>
</head>
<body style="background-color: #414141; color: aliceblue;">
    <h2>Amazing image</h2>
    <div >
        <ul id="images">
            <li><img width="200px" id="photoshop" src="https://images.pexels.com/photos/3561339/pexels-photo-3561339.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt="photoshop"></li>
            <li><img width="200px" id="japan" src="https://images.pexels.com/photos/3532553/pexels-photo-3532553.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><img width="200px" id="river" src="https://images.pexels.com/photos/3532551/pexels-photo-3532551.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><img width="200px" id="owl" src="https://images.pexels.com/photos/3532552/pexels-photo-3532552.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt="" ></li>
            <li><img width="200px" id="prayer" src="https://images.pexels.com/photos/2522671/pexels-photo-2522671.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><a style="color: aliceblue;" href="https://google.com" id="google">Google</a></li>
        </ul>
   </div>
</body>
<script>
    //to study:
    //types of events, timestamp, defaultPrevented
    //target, toElement, srcElement, currentTarget
    //clientX, clientY, screenX, screenY
    //atlkey, ctrlKey, shiftkey, keyCode

    //not the best approach to make elements reactive
    // document.getElementById('owl').onclick = function(){
    //     alert('owl')
    // }
    //others
    //attachEvent()
    //jQuery - on() 

    //the best
    // document.getElementById('owl').addEventListener('click', function(e){
    //     console.log(e)
    //     alert('owl click')
    // }, false)

    //what does the false mean in the argument list: decides event bubbling(false) , event capture(true)
    //false : bubbling - bottom to top : child element -> parent
    //true : capturing - top to bottom : parent -> child element

    // document.getElementById('images').addEventListener('click', function(e){
    //     console.log('clicked inside the ul')
    // }, false)
    // document.getElementById('owl').addEventListener('click', function(e){
    //     console.log('owl clicked')
    //     e.stopPropagation() //stops further propagation of the event
    // }, false)

    //stopping default behaviour
    document.getElementById('google').addEventListener('click', function(e){ //default here: opening the link
        console.log('google clicked')
        e.stopPropagation()
        e.preventDefault()  //does not open the link now
    }, false)

    //task: remove the list item ehich is clicked.
    //cannot make object for every list item, thus select the whole ul

    const ul = document.querySelector('#images')
    ul.addEventListener('click', function(e){
        if(e.target.tagName === 'IMG'){
            const removeIt = e.target.parentNode   //this selects li, when image(target) is clicked
            removeIt.remove()  //this removes the whole ul when we click a li instead of img, thus we added if

            //removeIt.parentNode.removeChild(removeIt)  //other option
        }
        
    }, false)
</script>
</html>
